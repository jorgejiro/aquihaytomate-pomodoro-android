name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint and unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Pinned to v5, not v6: from v6 the caching layer is the closed-source
      # gradle-actions-caching component, whose Terms of Use are not MIT. v5 is
      # already on Node 24, which is the only reason we needed to move.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # No keystore.properties on CI: app/build.gradle.kts falls back to an unsigned release
      # config, so debug builds and unit tests run fine without any secret.
      - name: Lint and test
        run: ./gradlew lint test --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: app/build/reports/tests/
          if-no-files-found: ignore
